<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  
  <!-- Demon body -->
  <ellipse cx="64" cy="80" rx="35" ry="25" fill="#8b0000"/>
  
  <!-- Demon head -->
  <circle cx="64" cy="50" r="25" fill="#a0001a"/>
  
  <!-- Horns -->
  <polygon points="45,35 50,20 55,35" fill="#2c1810"/>
  <polygon points="73,35 78,20 83,35" fill="#2c1810"/>
  
  <!-- Eyes -->
  <circle cx="56" cy="45" r="4" fill="#ff0000"/>
  <circle cx="72" cy="45" r="4" fill="#ff0000"/>
  <circle cx="56" cy="45" r="2" fill="#ffffff"/>
  <circle cx="72" cy="45" r="2" fill="#ffffff"/>
  
  <!-- Mouth -->
  <path d="M 54 58 Q 64 68 74 58" stroke="#000000" stroke-width="2" fill="none"/>
  
  <!-- Fangs -->
  <polygon points="58,58 60,65 62,58" fill="#ffffff"/>
  <polygon points="66,58 68,65 70,58" fill="#ffffff"/>
  
  <!-- Arms -->
  <ellipse cx="35" cy="70" rx="8" ry="20" fill="#8b0000" transform="rotate(-30 35 70)"/>
  <ellipse cx="93" cy="70" rx="8" ry="20" fill="#8b0000" transform="rotate(30 93 70)"/>
  
  <!-- Claws -->
  <polygon points="28,75 25,82 30,80" fill="#2c1810"/>
  <polygon points="100,75 103,82 98,80" fill="#2c1810"/>
  
  <!-- Magic aura -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.6" stroke-dasharray="4,4">
    <animateTransform attributeName="transform" type="rotate" values="0 64 64;360 64 64" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Title -->
  <text x="64" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff6b35" font-weight="bold">FERUMBRAS</text>
</svg>