<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0f0f23" stroke="#1a1a3a" stroke-width="2"/>
  
  <!-- Demon body -->
  <ellipse cx="64" cy="85" rx="40" ry="30" fill="#4a0080"/>
  
  <!-- Demon head -->
  <circle cx="64" cy="45" r="28" fill="#6600cc"/>
  
  <!-- Large horns -->
  <polygon points="40,25 45,8 50,25" fill="#1a0033"/>
  <polygon points="78,25 83,8 88,25" fill="#1a0033"/>
  
  <!-- Eyes -->
  <circle cx="54" cy="40" r="5" fill="#ff00ff"/>
  <circle cx="74" cy="40" r="5" fill="#ff00ff"/>
  <circle cx="54" cy="40" r="2" fill="#ffffff"/>
  <circle cx="74" cy="40" r="2" fill="#ffffff"/>
  
  <!-- Mouth -->
  <path d="M 50 55 Q 64 70 78 55" stroke="#000000" stroke-width="3" fill="none"/>
  
  <!-- Large fangs -->
  <polygon points="55,55 58,68 61,55" fill="#ffffff"/>
  <polygon points="67,55 70,68 73,55" fill="#ffffff"/>
  
  <!-- Wings -->
  <path d="M 25 60 Q 15 45 25 30 Q 35 45 25 60" fill="#2d0052" opacity="0.8"/>
  <path d="M 103 60 Q 113 45 103 30 Q 93 45 103 60" fill="#2d0052" opacity="0.8"/>
  
  <!-- Arms -->
  <ellipse cx="30" cy="75" rx="10" ry="25" fill="#4a0080" transform="rotate(-20 30 75)"/>
  <ellipse cx="98" cy="75" rx="10" ry="25" fill="#4a0080" transform="rotate(20 98 75)"/>
  
  <!-- Claws -->
  <polygon points="22,85 18,95 25,92" fill="#1a0033"/>
  <polygon points="106,85 110,95 103,92" fill="#1a0033"/>
  
  <!-- Magic energy -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#9933ff" stroke-width="2" opacity="0.7" stroke-dasharray="6,6">
    <animateTransform attributeName="transform" type="rotate" values="0 64 64;-360 64 64" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Title -->
  <text x="64" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9933ff" font-weight="bold">MORGAROTH</text>
</svg>