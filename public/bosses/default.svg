<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="2"/>
  
  <!-- Generic boss silhouette -->
  <ellipse cx="64" cy="80" rx="30" ry="20" fill="#4a4a4a"/>
  
  <!-- Head -->
  <circle cx="64" cy="50" r="20" fill="#5a5a5a"/>
  
  <!-- Eyes -->
  <circle cx="58" cy="45" r="3" fill="#ff4444"/>
  <circle cx="70" cy="45" r="3" fill="#ff4444"/>
  
  <!-- Crown/spikes -->
  <polygon points="50,35 54,25 58,35" fill="#6a6a6a"/>
  <polygon points="62,35 66,20 70,35" fill="#6a6a6a"/>
  <polygon points="74,35 78,25 82,35" fill="#6a6a6a"/>
  
  <!-- Arms -->
  <ellipse cx="40" cy="70" rx="8" ry="18" fill="#4a4a4a" transform="rotate(-15 40 70)"/>
  <ellipse cx="88" cy="70" rx="8" ry="18" fill="#4a4a4a" transform="rotate(15 88 70)"/>
  
  <!-- Question mark overlay -->
  <text x="64" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#888888" font-weight="bold">?</text>
  
  <!-- Mysterious aura -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#666666" stroke-width="1" opacity="0.6" stroke-dasharray="4,4">
    <animateTransform attributeName="transform" type="rotate" values="0 64 64;360 64 64" dur="8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Title -->
  <text x="64" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888888" font-weight="bold">BOSS</text>
</svg>